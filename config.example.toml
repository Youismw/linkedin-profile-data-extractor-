# LinkedIn Profile Extractor Configuration

input_file = "input/profiles.xlsx"
output_dir = "output"
auth_state_path = ".auth/state.json"

# Important fields expected in profile extraction
important_fields = [
    "name",
    "headline",
    "location",
    "about",
    "experience",
    "education",
    "skills",
]

# Polite pacing: random delay between profiles (in seconds)
delay_seconds_min = 1.0
delay_seconds_max = 2.0

# Timeout per page in seconds
page_timeout_seconds = 30.0

# Maximum profiles to process in a single run (null for all rows)
max_profiles = 0

# Number of concurrent browser workers (1 to 10, default: 1)
# Workload is partitioned fairly across workers (e.g. 13 candidates / 3 workers -> 5, 4, 4).
# Each extra worker operates with an isolated account (.auth/state_worker_N.json).
workers = 1

# Playwright browser mode
headless = true

# Deep details crawling: fetch full skills, experience, and education subpages
deep_details = true

# Disable supplemental discovery crawls (activity feed, interests, etc.) for much faster runs
disextra = false

# Progressive scroll steps per page (0 to 100, default: 25).
# Trade-off: More steps = more time, fuller data; fewer steps = less time, emptier data.
# Rule of thumb:
#   25 scrolls (~15,000px depth) captures ~80% of candidate data.
#   40 scrolls (~24,000px depth) captures ~90% of candidate data.
scroll_steps = 25

# Delay between incremental scroll steps in milliseconds (default: 250).
# Sets the pause duration between scroll increments (typically 150ms to 350ms).
# Trade-off:
#   - Pros: Lower step time (e.g., 150ms) delivers significantly faster runtimes.
#   - Cons: If set too low or on slower internet, dynamic lazy-loaded sections won't load in time.
#   - 250ms is the balanced default providing both high speed and reliable DOM hydration.
# WARNING: Do not set below 150ms. Setting --steptime 50 triggered LinkedIn's HTTP 999 anti-bot rate limit during testing.
scroll_step_delay_ms = 250

# Stale file pruning: when true, removes JSON files not present in current input workbook.
# Destructive cleanup is disabled by default to prevent accidental data loss.
prune_stale = false

# Stop the run immediately when a block/challenge is encountered
stop_on_block = true

# Logging level: DEBUG, INFO, WARNING, ERROR
log_level = "INFO"

